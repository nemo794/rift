[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rift"
version = "0.1.0"
description = "Geocode ESA BIOMASS and reproject NISAR GSLC to a master grid over Antarctica, then run inference"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["BIOMASS", "NISAR", "SAR", "geocoding", "Antarctica", "ISCE3", "remote sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.25",
    "rasterio>=1.4",
    "scipy",
    "h5py>=3.0",
    "lxml",
    "pyproj",
    "PyYAML",
    "python-dateutil",
    "requests",
    "tqdm",
    "jsonargparse>=4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/yourusername/rift"
Documentation = "https://github.com/yourusername/rift/tree/main/docs"
Repository = "https://github.com/yourusername/rift"
Issues = "https://github.com/yourusername/rift/issues"

[project.scripts]
rift = "rift.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
