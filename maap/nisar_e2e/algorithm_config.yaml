algorithm_name: rift-nisar-e2e
algorithm_description: >
  NISAR end-to-end: extract frequency-A amplitude from a NISAR L2 GSLC granule, regrid
  onto the Antarctica master grid (EPSG:3031, 512x512 chunks) in the complex domain with
  anti-aliasing, and run placeholder threshold inference to produce binary-mask COGs.
algorithm_version: main
repository_url: https://github.com/yourusername/rift.git
docker_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v4.2.0
build_command: rift/maap/nisar_e2e/build-env.sh
run_command: rift/maap/nisar_e2e/run.sh
disk_space: 100
queue: maap-dps-worker-32gb
inputs:
  file:
    - name: gslc
      description: NISAR L2 GSLC HDF5 granule
      required: true
  positional:
    - name: x_spacing
      description: Master grid X (azimuth) spacing in meters
      default: "5"
      required: false
    - name: y_spacing
      description: Master grid Y (range) spacing in meters
      default: "5"
      required: false
    - name: native
      description: Keep NISAR-native 5x5 spacing, snap extent only (true/false)
      default: "false"
      required: false
    - name: resampling
      description: Interpolation kernel (nearest|bilinear|lanczos|average)
      default: "nearest"
      required: false
    - name: threshold
      description: Inference amplitude threshold
      default: "0.5"
      required: false
    - name: pols
      description: Comma-separated polarizations (default all freq-A)
      default: ""
      required: false
    - name: keep_intermediates
      description: Keep amplitude COGs in output (true/false)
      default: "false"
      required: false
