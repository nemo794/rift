name: rift_nisar2cog

channels:
  - conda-forge

dependencies:
  - python=3.12
  # rift nisar2cog runtime (no isce3 needed for the NISAR path)
  - numpy>=1.25
  - scipy
  - h5py>=3.0
  - rasterio>=1.4
  - gdal>=3.13.3
  - pyproj
  - tqdm
  # credentialed granule access on the worker
  - earthaccess
  - s3fs
  - fsspec
  - boto3
  - botocore
  - requests
  - pip
  - pip:
      - jsonargparse>=4.27
      - maap-py
