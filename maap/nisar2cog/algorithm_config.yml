algorithm_description: >
  NISAR L2 GSLC to per-polarization amplitude (and phase) Cloud-Optimized GeoTIFFs on the
  Antarctica master grid (EPSG:3031, 512x512 chunks). Frequency-A complex samples are masked
  in the complex domain and placed losslessly (no resampling). No inference is run.
algorithm_name: rift-nisar2cog
algorithm_version: main
keywords: nisar, gslc, sar, cog, antarctica
code_repository: https://github.com/nemo794/rift.git
citation: https://github.com/nemo794/rift.git
author: Samantha C. Niemoeller
contributor: Samantha C. Niemoeller
license: https://raw.githubusercontent.com/nemo794/rift/main/LICENSE-BSD-3-Clause.txt
release_notes: Initial OGC application package for the nisar2cog workflow.

# The command MAAP invokes (CWL baseCommand). run.py is installed on PATH in the image.
run_command: run.py

# Resource hints (CWL ResourceRequirement). ram_min / outdir_max are in mebibytes.
# Tune after the first real run against a full-resolution granule.
ram_min: 6000
cores_min: 2
outdir_max: 20000

# Flat, named inputs (OGC drops positional args). Each name maps to a --<name> value CLI arg
# that run.py parses.
inputs:
  - name: gslc_url
    label: NISAR GSLC URL
    doc: HTTPS or S3 URL to a NISAR L2 GSLC .h5 granule. Downloaded into ./input at runtime.
    type: string
  - name: pols
    label: Polarizations
    doc: Comma-separated polarizations (e.g. HH,HV). Empty means all frequency-A pols.
    type: string?
    default: ""
  - name: amp_only
    label: Amplitude only
    doc: "true|false. When true, skip the per-pol phase COGs and write amplitude only."
    type: string?
    default: "false"

# The output/ directory is collected and staged out (CWL glob: ./output*).
outputs:
  - name: out
    type: Directory
