algorithm_name: rift-biomass-e2e
algorithm_description: >
  BIOMASS end-to-end: geocode an ESA BIOMASS L1A SCS granule to the Antarctica master
  grid (EPSG:3031, 512x512 chunks), extract amplitude COGs per polarization, and run
  placeholder threshold inference to produce binary-mask COGs. DEM is auto-downloaded
  via sardem if not supplied.
algorithm_version: main
repository_url: https://github.com/yourusername/rift.git
docker_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v4.2.0
build_command: rift/maap/biomass_e2e/build-env.sh
run_command: rift/maap/biomass_e2e/run.sh
disk_space: 50
queue: maap-dps-worker-32gb
inputs:
  file:
    - name: granule
      description: BIOMASS L1A SCS granule (.zip)
      required: true
    - name: dem
      description: Optional DEM (EPSG:3031 or 4326); auto-downloaded via sardem if omitted
      required: false
  positional:
    - name: x_spacing
      description: Master grid X (azimuth) spacing in meters
      default: "5"
      required: false
    - name: y_spacing
      description: Master grid Y (range) spacing in meters
      default: "5"
      required: false
    - name: native
      description: Use BIOMASS-native 5x40 spacing (true/false)
      default: "false"
      required: false
    - name: margin
      description: Footprint margin in meters
      default: "5000"
      required: false
    - name: threshold
      description: Inference amplitude threshold
      default: "0.5"
      required: false
    - name: pols
      description: Comma-separated polarizations (e.g. HH,HV)
      default: "HH"
      required: false
    - name: keep_intermediates
      description: Keep amplitude COGs in output (true/false)
      default: "false"
      required: false
