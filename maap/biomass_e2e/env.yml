name: rift_biomass2cog

channels:
  - conda-forge

dependencies:
  - python>=3.12          # isce3 0.25.17 requires Python 3.12+

  # Core SAR processing (BIOMASS geocoding engine)
  - isce3>=0.25.17
  - gdal>=3.13.3
  - libgdal-netcdf

  # Geospatial libraries
  - rasterio>=1.4
  - shapely>=2.0
  - affine
  - pyproj

  # Scientific computing
  - numpy>=1.25
  - scipy

  # Data formats
  - h5py>=3.0
  - lxml
  - pyyaml
  - netcdf4
  - xarray

  # Utilities
  - python-dateutil
  - requests
  - tqdm

  # Credentialed S3 fetch of the baked BIOMASS U-Net checkpoint at build time
  # (build.sh uses boto3 with MAAP workspace creds, then the default AWS chain).
  - boto3
  - botocore

  - pip
  - pip:
      - jsonargparse>=4.27   # rift CLI
      - sardem>=0.13         # DEM auto-download (NISAR DEM source, Antarctica)
      # --- ESA BIOMASS data access on the worker ---
      # (product zip is streamed with `requests`, above — the ESA /data/zipper/
      #  endpoint returns chunked/no-Content-Length, which obstore rejects.)
      - pystac-client>=0.9   # resolve the STAC Item on the ESA MAAP catalogue
      - maap-py>=5.1.0       # read ESA secrets on the worker
      # biomass-reader installed separately from GitHub in build.sh:
      #   git clone https://github.com/scottstanie/biomass-reader.git
      #   pip install './biomass-reader[ionosphere]'
