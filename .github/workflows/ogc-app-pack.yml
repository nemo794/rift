name: Build & deploy OGC app pack (nisar2cog)

# Generates the CWL workflow from algorithm_config.yml, validates it, builds the Docker image
# and pushes it to this repo's GitHub Container Registry, then registers the application
# package with the MAAP OGC processes API.
#
# Requires a repository secret named MAAP_TOKEN
# (from https://console.maap-project.org/profile/tokens).

on:
  push:
    branches:
      - '**'
    paths:
      - 'maap/nisar2cog/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/ogc-app-pack.yml'
  workflow_dispatch:

jobs:
  build_app_pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v6

      - name: Build & deploy OGC application package
        uses: MAAP-Project/ogc-app-pack-generator@1.0.0
        with:
          algorithm-configuration-path: maap/nisar2cog/algorithm_config.yml
          dockerfile-path: maap/nisar2cog/Dockerfile
          deploy-app-pack: true
          app-pack-register-endpoint: https://api.maap-project.org/api/ogc/processes
        env:
          # The generator's deploy script requires an env var named MAAP_TOKEN; source it
          # from the repo secret (named NASAMAAP here).
          MAAP_TOKEN: ${{ secrets.NASAMAAP }}
